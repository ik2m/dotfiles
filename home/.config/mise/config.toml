[tools]
node = "24"
pnpm = "latest"
uv = "latest"
# Windows は mise activate していないので、mise 管理外で入れたものを使う
starship = { version = "latest", os = ["linux"] }

[settings]
idiomatic_version_file_enable_tools = ["node"]
# Windows でもコピーではなくシンボリックリンクで配置する（要 開発者モード）
dotfiles.windows_symlinks = true

[settings.tool_update]
global_auto = true
